[workspace]
members = [
  "crates/rex-cli",
  "crates/rex-client",
  "crates/rex-cluster",
  "crates/rex-core",
  "crates/rex-persistence",
  "crates/rex-sender",
  "crates/rex-server",
  "crates/rex-test",
  "crates/rex-observability",
  "crates/rex-config",
  "bindings/rex4p",
  "bindings/rex4j",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

# =====================
# Workspace Lints
# =====================
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# =====================
# Workspace Dependencies
# (按功能分组：子 crate 仅使用 .workspace = true 引用,不在本地维护版本)
# =====================
[workspace.dependencies]

# --- 内部子 crate (path 依赖,版本对齐 workspace.package) ---
rex-core = { path = "crates/rex-core" }
rex-sender = { path = "crates/rex-sender" }
rex-client = { path = "crates/rex-client" }
rex-server = { path = "crates/rex-server" }
rex-persistence = { path = "crates/rex-persistence" }
rex-cluster = { path = "crates/rex-cluster" }
rex-config = { path = "crates/rex-config" }
rex-observability = { path = "crates/rex-observability" }

# --- 异步运行时与并发原语 ---
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
futures = "0.3.33"
futures-util = "0.3.33"
async-trait = "0.1.91"
kanal = "0.1.1"
parking_lot = "0.12.5"
arc-swap = "1.9.2"
once_cell = "1.21.4"
scopeguard = "1.2.0"

# --- 网络与传输 ---
quinn = "0.11.11"
rustls = { version = "0.23.43", default-features = false }
rcgen = "0.14.8"
tokio-tungstenite = "0.28.0"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

# --- 序列化与配置 ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
bincode = "1.3.3"

# --- 数据结构与性能 ---
bytes = "1.12.1"
dashmap = "6.2.1"
ahash = "0.8.12"
hdrhistogram = "7.6.0"

# --- 持久化存储 ---
sled = "0.34.7"

# --- 标识与随机性 ---
uuid = { version = "1.24.0", features = ["v4"] }
rand = "0.10.2"
fastrand = "2.5"

# --- 错误处理与工具 ---
anyhow = "1.0.104"
thiserror = "2.0.19"
regex = "1"
itertools = "0.14.0"

# --- 可观测性 (日志 / 指标 / 链路) ---
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
prometheus = "0.14.0"

# --- 命令行与枚举派发 ---
clap = { version = "4.6.5", features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"

# --- 基准与测试 ---
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }

# --- 语言绑定 (JNI / PyO3) ---
jni = "0.22.4"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

# --- test utilities ---
tempfile = "3"
temp-env = "0.3"
assert_cmd = "2"
predicates = "3"

# =====================
# Build Profiles
# =====================
[profile.dev]
opt-level = 0
debug = true
lto = false

[profile.release]
opt-level = 3
debug = false
lto = "thin"

[profile.bench]
inherits = "release"
debug = true
