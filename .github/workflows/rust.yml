name: Rust

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback loop: library unit tests only. If this is red, every
  # downstream job will likely fail too — running first keeps PR authors
  # out of the build-job queue.
  rust-lib:
    name: Rust workspace lib tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build workspace (all targets)
        # Builds everything so downstream integration tests don't pay
        # the cold-compile cost.
        run: cargo build --workspace --all-targets
      - name: Run lib tests
        run: cargo test --workspace --lib

  # Integration tests (anything outside src/). The rex-cli integration
  # tests need a built [[bin]] to spawn, so we cannot run these until
  # the lib build is green; they run in parallel with the bindings
  # jobs since they don't share artefacts.
  rust-integration:
    name: Rust integration tests (cli_config + rex-test)
    runs-on: ubuntu-latest
    needs: rust-lib

    steps:
      - uses: actions/checkout@v4
      - name: Run rex-cli cli_config integration tests
        # The `[[bin]] name = "rex"` test harness; assert_cmd spawns the
        # compiled binary. Today this is just cli_config.rs.
        run: cargo test -p rex-cli --test cli_config
      - name: Run rex-test E2E suite
        # crates/rex-test/tests/* — full server E2E across TCP/QUIC/WS
        # + observability + persistence + cluster + toml config.
        run: cargo test -p rex-test

  port_refuse:
    name: port_refuse example
    runs-on: ubuntu-latest
    needs: rust-lib

    steps:
      - uses: actions/checkout@v4
      - name: Run port_refuse example
        run: cargo run --example port_refuse

  # Binding cdylib builds. The workspace build in rust-lib already
  # compiles them; this job asserts each cdylib builds in isolation so
  # a future workspace-level dep change can't accidentally break only
  # the bindings. Catches `jni` / `pyo3` ABI drift early.
  bindings-rust:
    name: Binding cdylibs (rex4j / rex4p)
    runs-on: ubuntu-latest
    needs: rust-lib

    steps:
      - uses: actions/checkout@v4
      - name: Install Python headers (for rex4p)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      - name: Build rex4j cdylib
        run: cargo build -p rex4j
      - name: Build rex4p cdylib
        run: cargo build -p rex4p

  # rex4j Java side. cargo builds the cdylib, mvn runs the Java build
  # + SpotBugs. The native lib is copied into the Java resource dir so
  # the JVM can load it at test / runtime.
  bindings-java:
    name: rex4j Java build + SpotBugs
    runs-on: ubuntu-latest
    needs: rust-lib

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build rex4j native cdylib (cargo)
        run: cargo build -p rex4j
      - name: Copy native lib into Java resource dir
        # The Java example + tests load `librex4j.so` from this path.
        # See README "java" section.
        run: |
          mkdir -p bindings/rex4j/src/main/resources
          cp target/debug/librex4j.so bindings/rex4j/src/main/resources/
      - name: Run mvn test (rex4j)
        working-directory: bindings/rex4j
        run: mvn test
      - name: Run SpotBugs
        working-directory: bindings/rex4j
        run: mvn spotbugs:check
